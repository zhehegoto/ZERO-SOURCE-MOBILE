<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f0ff">
    <meta name="description" content="零源机构|ZERO‑SOURCE 更新日志 - 记录所有更新与优化">
    <meta name="format-detection" content="telephone=no,email=no,address=no">
    <title>更新日志 | 零源机构</title>

    <script>document.documentElement.classList.add('has-js');</script>

    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="stylesheet" href="../css/icons.css">
    <link rel="stylesheet" href="../assets/fonts-min.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/wtfk.css">
    <link rel="stylesheet" href="../css/gxrz.css">
</head>

<body data-page="gxrz" data-title="更新日志" data-base="../" data-back="1">

    <div class="app-bg" aria-hidden="true"></div>

    <main class="app-main">
        <div class="wrap">

            <section class="section">
                <div class="cl-hero">
                    <div class="hero-tag">CHANGELOG</div>
                    <h1 class="hero-title">更新日志</h1>
                    <p class="hero-subtitle">记录零源机构|ZERO‑SOURCE的所有更新与优化<br>见证我们的成长与进步</p>
                </div>

                <div class="stat-grid cl-stats">
                    <div class="stat-card glass reveal">
                        <div class="stat-icon icon-pink"></div>
                        <div class="stat-number" id="totalVersions" data-count="0">0</div>
                        <div class="stat-label">版本更新</div>
                    </div>

                    <div class="stat-card glass reveal">
                        <div class="stat-icon icon-blue"></div>
                        <div class="stat-number" id="totalDays" data-count="0">0</div>
                        <div class="stat-label">运行天数</div>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="section-head">
                    <span class="section-tag">VERSIONS</span>
                    <h2 class="section-title">版本记录</h2>
                    <p class="section-desc">点击版本卡片可展开 / 收起</p>
                </div>

                <div class="timeline" id="timeline"></div>
            </section>

        </div>
    </main>

    <script src="../js/core.js"></script>
    <script src="../js/wtfk.js"></script>
    <script src="../js/gxrz.js"></script>
</body>

</html>
