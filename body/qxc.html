<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f0ff">
    <meta name="description" content="零源机构群相册 — 散落的记忆碎片（移动端）">
    <meta name="format-detection" content="telephone=no,email=no,address=no">
    <title>群相册 | 零源机构</title>

    <script>document.documentElement.classList.add('has-js');</script>

    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

    <link rel="stylesheet" href="../css/icons.css">
    <link rel="stylesheet" href="../assets/fonts-min.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/wtfk.css">
    <link rel="stylesheet" href="../css/qxc.css">
</head>

<body data-page="qxc" data-title="群相册" data-base="../">

    <div class="app-bg" aria-hidden="true"></div>

    <main class="app-main">

        <section class="gallery-hero">
            <div class="hero-inner">
                <span class="gallery-badge">MEMORY</span>
                <h1 class="gallery-title">详情请看-页脚-<wbr>隐私政策-05群相册</h1>
                <p class="gallery-subtitle">每一张照片，都是时光的碎片</p>
                <div class="gallery-hint">

                    <span>点击放大 · 左右滑动切换</span>
                </div>

                <p class="gallery-note">

                    照片整理中 · 占位待你来填满
                </p>
            </div>
        </section>

        <section class="photo-desk" id="photoDesk" aria-label="群相册照片">

            <div class="photo-grid" id="photoGrid"></div>
        </section>

        <div class="desk-load-more" id="deskLoadMore">
            <button class="btn primary load-more-btn" id="loadMoreBtn" type="button">
拾起更多记忆
            </button>
            <div class="loading-indicator" id="loadingIndicator" hidden>
                正在翻找照片…
            </div>
        </div>

    </main>

    <div class="immersive-preview is-hidden" id="immersivePreview" role="dialog" aria-modal="true"
        aria-label="照片预览" aria-hidden="true">
        <div class="preview-bg" id="previewBg"></div>

        <div class="preview-topbar">
            <span class="preview-topnum" id="previewTopNum">1 / 118</span>
            <button class="preview-close" id="previewClose" type="button" aria-label="关闭预览">关闭</button>
        </div>

        <div class="preview-stage" id="previewStage"></div>

        <div class="preview-caption">
            <span class="caption-title" id="captionTitle">记忆碎片</span>
            <span class="caption-index" id="captionIndex">1 / 118</span>
            <span class="caption-swipe" aria-hidden="true">
滑动切换
            </span>
        </div>
    </div>

    <script src="../js/core.js"></script>
    <script src="../js/wtfk.js"></script>
    <script src="../js/qxc.js"></script>
</body>

</html>
