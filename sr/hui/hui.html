<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#150f26">
    <meta name="description" content="零源机构 Z℮R∅‑SOURCE 生日彩蛋 · SUR1 生日快乐，踏遍星海，自成锋芒">
    <meta name="format-detection" content="telephone=no,email=no,address=no">
    <title>SUR1 生日快乐 | 零源机构</title>

    <!-- 标记 JS 可用：进场动画只在此时才隐藏内容，保证禁用 JS 也能看到全部内容 -->
    <script>document.documentElement.classList.add('has-js');</script>

    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">

    <link rel="stylesheet" href="../../css/icons.css">
    <link rel="stylesheet" href="../../assets/fonts-min.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/sr-hui.css">
</head>

<body class="sr-page" data-page="sr" data-title="" data-base="../../" data-tabbar="off" data-back="1">

    <div class="app-bg" aria-hidden="true"></div>
    <div class="sr-bg" aria-hidden="true"></div>
    <div class="sr-glow" aria-hidden="true"></div>
    <canvas id="particleCanvas" aria-hidden="true"></canvas>
    <canvas id="fireworks-canvas" aria-hidden="true"></canvas>

    <main class="app-main sr-main">
        <div class="wrap">

            <!-- ==================== 首屏 ==================== -->
            <header class="sr-hero">
                <h1 class="sr-hero-name">✨ SUR1 ✨</h1>
                <p class="sr-hero-sub">HAPPY BIRTHDAY</p>
                <div class="sr-hero-badge">

                    <span>踏遍星海・自成锋芒</span>

                </div>
            </header>

            <!-- ==================== 3D 翻转卡 ==================== -->
            <div class="sr-card-wrap">
                <div class="sr-card" id="flipCard" role="button" tabindex="0" aria-label="轻点卡片翻转惊喜">
                    <div class="sr-face sr-face-front">
                        <div class="sr-avatar"></div>
                        <h2 class="sr-card-name">SUR1</h2>
                        <p class="sr-card-role">✨ 今日主角 ✨</p>
                        <div class="sr-click-hint">

                            轻点卡片 · 翻转惊喜

                        </div>
                    </div>
                    <div class="sr-face sr-face-back">
                        <!-- 不规则有机圆角底（与 base.css 的 --r-card 设计语言一致） -->
                        <svg class="sr-face-fill" viewBox="0 0 320 380" preserveAspectRatio="none" aria-hidden="true">
                            <defs>
                                <linearGradient id="srBackHui" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0" stop-color="#ffb7c5" />
                                    <stop offset="0.55" stop-color="#e85d8e" />
                                    <stop offset="1" stop-color="#b76eff" />
                                </linearGradient>
                            </defs>
                            <path fill="url(#srBackHui)" d="M32 0L292 0A28 28 0 0 1 320 28L320 352A28 28 0 0 1 292 380L36 380A36 36 0 0 1 0 344L0 32A32 32 0 0 1 32 0Z" />
                        </svg>
                        <div class="sr-msg">🎂 生日快乐 🎂</div>
                        <div class="sr-bless">
                            愿你手握漫天璀璨星光<br>
                            所向皆坦途，所行皆荣光<br>
                            「Zero · 零号」<br>
                            💙 步履不停 锋芒尽现 💙
                        </div>

                    </div>
                </div>
            </div>

            <!-- ==================== 惊喜关键词 ==================== -->
            <section class="sr-grid">
                <div class="sr-feature">
                    <div class="sr-feature-icon"></div>
                    <h3>逐光而行</h3>
                    <p>心怀滚烫理想，奔赴属于自己的浩瀚远方。</p>
                </div>
                <div class="sr-feature">
                    <div class="sr-feature-icon"></div>
                    <h3>锋芒自现</h3>
                    <p>沉淀的力量，终会化作照亮前路的光。</p>
                </div>
                <div class="sr-feature">
                    <div class="sr-feature-icon"></div>
                    <h3>赤诚不改</h3>
                    <p>保持心中热忱，奔赴下一场山海。</p>
                </div>
                <div class="sr-feature">
                    <div class="sr-feature-icon"></div>
                    <h3>万丈荣光</h3>
                    <p>好运与实力相伴，续写崭新篇章。</p>
                </div>
            </section>

            <!-- ==================== 生日专属庆典计时器 ==================== -->
            <section class="sr-countdown">
                <h3>

                    生日专属庆典计时器

                </h3>
                <div id="birthdayTimer" class="sr-timer">
                    <div class="sr-time-box"><span class="sr-time-num" id="days">00</span>天</div>
                    <div class="sr-time-box"><span class="sr-time-num" id="hours">00</span>时</div>
                    <div class="sr-time-box"><span class="sr-time-num" id="mins">00</span>分</div>
                    <div class="sr-time-box"><span class="sr-time-num" id="secs">00</span>秒</div>
                </div>
                <p class="sr-countdown-foot">

                    每一秒都在为你喝彩

                </p>
            </section>

            <!-- ==================== 页尾祝福 ==================== -->
            <section class="sr-outro">
                <p>🎈 新的一岁，光芒所至，万物生辉 🎈</p>
                <p class="sr-sign">Z℮R∅零号</p>
                <a class="sr-home-link" href="../../index.html">
返回首页
                </a>
            </section>

        </div>
    </main>

    <!-- ==================== 音乐（点击后才播放） ==================== -->
    <div class="sr-music">
        <button class="sr-music-btn" id="musicBtn" type="button" aria-label="播放生日音乐" aria-pressed="false">
            <span class="ib-txt" id="musicIcon">播放</span>
        </button>
    </div>

    <script src="../../js/core.js"></script>
    <script src="../../js/sr-core.js"></script>
    <script src="../../js/sr-hui.js"></script>
</body>

</html>
